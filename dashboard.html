<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            color: white;
        }

        .box {
            width: 400px;
            padding: 45px;
            text-align: center;
            background: #1e293b;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        h1 {
            margin-bottom: 15px;
        }

        p {
            color: #94a3b8;
            margin-bottom: 25px;
        }

        .logout {
            display: inline-block;
            padding: 12px 25px;
            background: #ef4444;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .logout:hover {
            background: #dc2626;
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="icon">🔐</div>

        <h1>Welcome, {{ username }}!</h1>

        <p>You have successfully logged in.</p>

        <a class="logout" href="/logout">Logout</a>

    </div>

</body>
</html>
