<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            color: white;
        }

        .box {
            width: 350px;
            padding: 35px;
            background: #1e293b;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #475569;
            border-radius: 8px;
            background: #0f172a;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #38bdf8;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0ea5e9;
        }

        .message {
            text-align: center;
            color: #f87171;
            margin: 15px 0;
        }

        .login {
            text-align: center;
            margin-top: 20px;
            color: #94a3b8;
        }

        a {
            color: #38bdf8;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>🛡️ Create Account</h1>

        <p class="subtitle">Create your secure account.</p>

        <form method="POST">

            <label>Username</label>
            <input
                type="text"
                name="username"
                placeholder="Choose a username"
                required
            >

            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Create a password"
                required
            >

            <button type="submit">Register</button>

        </form>

        <p class="message">{{ message }}</p>

        <p class="login">
            Already have an account?
            <a href="/login">Login</a>
        </p>

    </div>

</body>
</html>
